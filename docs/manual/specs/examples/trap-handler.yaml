# ModuleSpec example: user/kernel trap boundary
id: kernel/trap
module: kernel/trap
level: 3
purpose: enter the kernel, classify a trap, and return with a valid context
owns:
  - kernel/trap.c
  - tests/trap
interface:
  - name: handle_trap
    pre: [trap_frame_valid]
    post: [return_context_is_restorable]
    errors: [unexpected_trap]
    properties:
      - id: privilege_restore
        text: return restores the saved privilege and program counter
        check: trap_privilege_restore
properties:
  - id: no_user_leak
    text: kernel-only state is not exposed in the user return frame
errors: [unexpected_trap]
state:
  trap_frame: per_cpu
preconditions: [trap_frame_valid]
postconditions: [return_context_is_restorable]
invariants: [no_user_leak]
dependencies: [kernel/interrupt]
concurrency:
  interrupt_context: serialized_per_cpu
rely: [interrupt entry preserves the frame pointer]
guarantee: [every return path restores privilege state]
algorithm_intent: table_driven_dispatch
