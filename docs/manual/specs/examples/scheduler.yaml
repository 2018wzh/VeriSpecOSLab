# ModuleSpec example: scheduler with an L3 concurrency contract
id: kernel/scheduler
module: kernel/scheduler
level: 3
purpose: choose the next runnable task without losing ownership
owns:
  - kernel/scheduler.c
  - tests/scheduler
interface:
  - name: schedule
    pre: [run_queue_initialized]
    post: [selected_task_is_runnable]
    errors: [no_runnable_task]
    properties:
      - id: queue_consistency
        text: each runnable task appears exactly once
        check: scheduler_queue_consistency
properties:
  - id: progress
    text: a runnable task is eventually selected
errors: [no_runnable_task]
state:
  run_queue: intrusive_queue
preconditions: [run_queue_initialized]
postconditions: [selected_task_is_runnable]
invariants: [queue_consistency]
dependencies: [kernel/process]
concurrency:
  lock: run_queue_lock
  interrupt_context: disabled
rely: [interrupt handlers preserve queue links]
guarantee: [one task is selected atomically]
algorithm_intent: round_robin
