# InterfaceSpec example: write syscall ABI
id: abi/syscall-write
name: write syscall
boundary: syscall
module: kernel/syscall
operations:
  - name: write
    input:
      fd: integer
      buffer: user_pointer
      length: integer
    output: integer
    pre: [fd_is_open, buffer_is_readable, length_is_bounded]
    post: [returned_count_is_nonnegative_or_error]
    errors: [bad_fd, bad_pointer, interrupted]
    properties:
      - id: copy_check
        text: kernel validates the user buffer before copying
        check: syscall_write_pointer_validation
