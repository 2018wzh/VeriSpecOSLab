<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#f7f9fc"/><rect width="1600" height="12" fill="#3156d8"/>
  <text x="70" y="82" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#3156d8">P9 · RUNTIME FAULT / 02 CONFIRM, THEN INSTRUMENT</text>
  <text x="70" y="142" font-family="Arial, sans-serif" font-size="44" font-weight="700" fill="#14213d">Typed probes turn a suspicious jump into a falsifiable cause</text>
  <rect x="70" y="195" width="715" height="525" rx="18" fill="#ffffff" stroke="#d8dfea" stroke-width="2"/>
  <text x="110" y="250" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#14213d">Typed GDB trap context</text>
  <text x="110" y="306" font-family="Consolas, monospace" font-size="24" fill="#3156d8">observation_id: gdb-trap-1</text>
  <rect x="108" y="342" width="640" height="182" rx="12" fill="#111827"/>
  <text x="138" y="395" font-family="Consolas, monospace" font-size="30" fill="#ffffff">scause = 15</text><text x="138" y="445" font-family="Consolas, monospace" font-size="30" fill="#ffffff">stval  = 0x4000</text><text x="138" y="495" font-family="Consolas, monospace" font-size="30" fill="#ffffff">sepc   = 0x80001234</text>
  <text x="110" y="580" font-family="Arial, sans-serif" font-size="23" fill="#667085">Store page fault at the same PC seen by TCG.</text>
  <text x="110" y="626" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#168b5b">Hypothesis supported: user mapping lacks PTE_W.</text>
  <rect x="815" y="195" width="715" height="525" rx="18" fill="#ffffff" stroke="#d8dfea" stroke-width="2"/>
  <text x="855" y="250" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#14213d">Guest instrumentation is the last resort</text>
  <text x="855" y="304" font-family="Arial, sans-serif" font-size="22" fill="#667085">Only when TCG + GDB + QMP cannot answer a semantic question:</text>
  <rect x="855" y="350" width="635" height="74" rx="12" fill="#eaf0ff"/><text x="887" y="396" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#3156d8">1  Create a detached Git worktree</text>
  <rect x="855" y="444" width="635" height="74" rx="12" fill="#fff5d6"/><text x="887" y="490" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#9a6200">2  Apply the smallest validated trace patch</text>
  <rect x="855" y="538" width="635" height="74" rx="12" fill="#e7f6ef"/><text x="887" y="584" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#168b5b">3  Run bounded cases; preserve evidence</text>
  <text x="855" y="660" font-family="Arial, sans-serif" font-size="21" fill="#c43d4d">Never patch the student's original tree. Never turn diagnosis into pass.</text>
  <rect x="70" y="756" width="1460" height="78" rx="16" fill="#14213d"/>
  <text x="800" y="805" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#ffffff">TCG broad discovery → typed GDB confirmation → QMP/HMP context → detached instrumentation last</text>
</svg>
